TOTAL_TIMESTEPS: 100000
PARAM: 0.00001
ALGO: "OURS"
DEVICE: "cuda:2"
ENV_NAME: "InvertedPendulum-v5"
seed: 1

# EXP_NAME: "thesis/test_0_entropy"
# EXP_NAME: 'test-discriminantneg_1e-'

policy_kwargs:
  use_sde: True

ours_policy_kwargs:
  use_sde: False
  pi_be_ratio: 0.2
  pi_b_nf: True
ablation_mode: False

sb3_hyperparams: False

check_anomaly: False # checks if any non-finite values appear in torch backward()


EXP_NAME: "ecml/${ENV_NAME}-${ALGO}-${PARAM}-pibe-${ours_policy_kwargs.pi_be_ratio}_sb3hyperparams_nf"

hydra:
  run:
    dir: ./runs/${EXP_NAME}
